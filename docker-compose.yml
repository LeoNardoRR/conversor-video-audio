services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATA_DIR: /data/jobs
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-12}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
      RETENTION_HOURS: ${RETENTION_HOURS:-6}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      AUDIT_DIR: /data/audit
      RESEARCH_RATE_LIMIT: ${RESEARCH_RATE_LIMIT:-30}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WHISPER_URL: http://transcriber:8080
      MAX_TRANSCRIPTION_HOURS: ${MAX_TRANSCRIPTION_HOURS:-6}
    volumes:
      - converter_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  transcriber:
    build:
      context: ./transcriber
    image: media-tools-transcriber
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MODEL=/models/ggml-base.bin
        EXPECTED_SHA=465707469ff3a37a2b9b8d8f89f2f99de7299dac
        if [ ! -f "$${MODEL}" ] || ! echo "$${EXPECTED_SHA}  $${MODEL}" | sha1sum -c - >/dev/null 2>&1; then
          rm -f "$${MODEL}" "$${MODEL}.tmp"
          curl --fail --location --retry 3 --output "$${MODEL}.tmp" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          echo "$${EXPECTED_SHA}  $${MODEL}.tmp" | sha1sum -c -
          mv "$${MODEL}.tmp" "$${MODEL}"
        fi
        exec whisper-server --host 0.0.0.0 --port 8080 --model /models/ggml-base.bin --threads 2
    volumes:
      - whisper_models:/models
    mem_limit: 4g
    cpus: 2.0

  web:
    build:
      context: .
      args:
        VITE_CONVERSION_MODE: server
        VITE_MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-12}
        VITE_RETENTION_HOURS: ${RETENTION_HOURS:-6}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  converter_data:
  whisper_models:
  caddy_data:
  caddy_config:
