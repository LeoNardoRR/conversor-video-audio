services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATA_DIR: /data/jobs
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-12}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
      RETENTION_HOURS: ${RETENTION_HOURS:-6}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
    volumes:
      - converter_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      args:
        VITE_CONVERSION_MODE: server
        VITE_MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-12}
        VITE_RETENTION_HOURS: ${RETENTION_HOURS:-6}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  converter_data:
  caddy_data:
  caddy_config:
